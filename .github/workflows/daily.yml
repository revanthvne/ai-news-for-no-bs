name: Daily AI Short

# Runs every morning, builds the edition from live free sources, synthesizes
# the deep-dives, emails you the APPROVAL REQUIRED edition, and commits the
# edition JSON so the web app (Vercel) serves the newest content.
#
# Cost: $0 — GitHub Actions free minutes are plenty for one short run/day.

on:
  schedule:
    - cron: "0 13 * * *"   # 13:00 UTC daily (~6am PT / 6:30pm IST). Adjust as needed.
  workflow_dispatch: {}      # lets you run it manually from the Actions tab

permissions:
  contents: write            # allow committing the new edition JSON

jobs:
  build-edition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Build + email today's edition
        working-directory: pipeline
        env:
          LLM_PROVIDER:  ${{ secrets.LLM_PROVIDER }}
          GROQ_API_KEY:  ${{ secrets.GROQ_API_KEY }}
          LLM_MODEL:     ${{ secrets.LLM_MODEL }}
          EMAIL_PROVIDER: ${{ secrets.EMAIL_PROVIDER }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM:    ${{ secrets.EMAIL_FROM }}
          APPROVER_EMAIL: ${{ secrets.APPROVER_EMAIL }}
          SUPABASE_URL:  ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          APPROVE_BASE_URL: ${{ secrets.APPROVE_BASE_URL }}
          GITHUB_TOKEN:  ${{ secrets.GH_READ_TOKEN }}
        run: python run.py --live

      - name: Commit new edition JSON
        run: |
          git config user.name  "no-bs-bot"
          git config user.email "bot@users.noreply.github.com"
          git add web/public/editions/*.json pipeline/output/*.json || true
          git commit -m "edition: $(date -u +%Y-%m-%d)" || echo "nothing to commit"
          git push || echo "push skipped"
