name: NO BS edition (every 6h)

# Runs every 6 hours, rebuilds the edition from live free sources, synthesizes
# the deep-dives, emails you the APPROVAL REQUIRED edition, and commits the
# edition JSON so the web app (Vercel) auto-redeploys with the newest content.
#
# Cost: $0 — 4 runs/day x ~2 min = ~240 min/month, well inside the 2,000 free
# GitHub Actions minutes.

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours: 00:00, 06:00, 12:00, 18:00 UTC
  workflow_dispatch: {}      # lets you run it manually from the Actions tab

permissions:
  contents: write            # allow committing the new edition JSON

jobs:
  build-edition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Run pipeline tests
        run: python pipeline/test_pipeline.py

      - name: Build + email today's edition
        working-directory: pipeline
        env:
          AUTO_PUBLISH:  "true"                        # scheduled editions go live automatically
          GOOGLE_TRENDS: ${{ secrets.GOOGLE_TRENDS }}  # "true" = real Google Trends volume (optional)
          GOOGLE_TRENDS_GEO: ${{ secrets.GOOGLE_TRENDS_GEO }}
          LLM_PROVIDER:  ${{ secrets.LLM_PROVIDER }}
          GROQ_API_KEY:  ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LLM_MODEL:     ${{ secrets.LLM_MODEL }}
          EMAIL_PROVIDER: ${{ secrets.EMAIL_PROVIDER }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM:    ${{ secrets.EMAIL_FROM }}
          APPROVER_EMAIL: ${{ secrets.APPROVER_EMAIL }}
          SUPABASE_URL:  ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          APPROVE_BASE_URL: ${{ secrets.APPROVE_BASE_URL }}
          GITHUB_TOKEN:  ${{ secrets.GH_READ_TOKEN }}
        run: python run.py --live

      - name: Commit new edition JSON
        run: |
          git config user.name  "no-bs-bot"
          git config user.email "bot@users.noreply.github.com"
          git add web/public/editions/*.json pipeline/output/*.json || true
          git commit -m "edition: $(date -u +%Y-%m-%d)" || echo "nothing to commit"
          git push || echo "push skipped"
